name: Merge train trigger

# This completion-triggered workflow checks out trusted base-branch code and uses event fields as API data only.
on: # zizmor: ignore[dangerous-triggers]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.ai/**'
      - 'data/repository_branch_retirements.json'
      - '.githooks/**'
      - 'lefthook.yml'
      - '.gitignore'
  workflow_run:
    workflows: ["Agent merge queue"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: merge-train-main
  cancel-in-progress: false

jobs:
  trigger:
    name: Autonomous Reactive Merge Train
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted train code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run reactive merge train scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_QUEUE_BASE_BRANCH: ${{ github.ref_name }}
        run: node scripts/merge_train_trigger.mjs
        shell: bash
