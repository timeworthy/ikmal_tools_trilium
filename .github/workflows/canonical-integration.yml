name: Canonical integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.ai/**'
      - 'data/repository_branch_retirements.json'
      - '.githooks/**'
      - 'lefthook.yml'
  workflow_dispatch:

concurrency:
  group: canonical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integrity:
    name: Canonical integration / integrity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Targeted change evaluation
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_ref="origin/$TARGET_BASE_BRANCH"
            changed_files=$(git diff --name-only "$base_ref"...HEAD || true)
            echo "Changed files in PR:"
            echo "$changed_files"

            non_code_count=$(grep -Ec '^(\.ai\/|docs\/|.*\.md$|\.gitignore$)' <<<"$changed_files" || true)
            total_count=$(grep -cv '^$' <<<"$changed_files" || true)

            if [ "$total_count" -gt 0 ] && [ "$non_code_count" -eq "$total_count" ]; then
              echo "fast_path=true" >> "$GITHUB_OUTPUT"
              echo "⚡ Purely documentation / metadata changes detected ($non_code_count/$total_count files). Fast-path enabled."
              exit 0
            fi
          fi
          echo "fast_path=false" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Node
        if: steps.filter.outputs.fast_path != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # The generic gate runs `npm run test`, whose pretest step type-checks with the
      # locally installed TypeScript, so a fresh runner needs the lockfile's exact deps.
      - name: Install JavaScript dependencies
        if: steps.filter.outputs.fast_path != 'true' && hashFiles('package-lock.json') != ''
        run: npm ci --no-audit --no-fund
        shell: bash

      - name: Set up Go
        if: steps.filter.outputs.fast_path != 'true' && hashFiles('go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Go for workflow linting
        if: steps.filter.outputs.fast_path != 'true' && hashFiles('go.mod') == ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache: false

      - name: Set up Python for workflow security linting
        if: steps.filter.outputs.fast_path != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Install pinned workflow security linter
        if: steps.filter.outputs.fast_path != 'true'
        run: python -m pip install --disable-pip-version-check --no-input 'zizmor==1.29.0'
        shell: bash

      - name: Run the local pre-PR gate
        if: steps.filter.outputs.fast_path != 'true'
        env:
          FLEETDEV_REQUIRE_WORKFLOW_LINTERS: "1"
        run: bash scripts/pre-pr-checks.sh
        shell: bash

      - name: Fast-path completion notice
        if: steps.filter.outputs.fast_path == 'true'
        run: |
          echo "✅ Targeted non-functional edits verified via fast-path; heavy integration steps skipped to preserve runner capacity."
        shell: bash
